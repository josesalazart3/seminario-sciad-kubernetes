# ============================================================
# SCIAD — PLANTILLA de secretos (NO contiene valores reales)
# El Secret real se crea con scripts/crear-secretos.sh a partir de .env.prod,
# que no se versiona. Este archivo solo documenta qué claves existen.
# NO aplicar este archivo tal cual.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: sciad-secrets
  namespace: jsalazart3
  labels:
    app.kubernetes.io/part-of: sciad
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<contraseña de PostgreSQL>"
  ConnectionStrings__Postgres: "Host=db;Port=5432;Database=sciad;Username=sciad;Password=<contraseña>;Maximum Pool Size=50"
  Jwt__Secreto: "<secreto JWT, mínimo 32 caracteres>"
  QR_ENCRYPTION_KEY: "<32 bytes en base64>"
  Seed__AdminEmail: "<correo del administrador inicial>"
  Seed__AdminPassword: "<contraseña del administrador, mínimo 12 caracteres>"
