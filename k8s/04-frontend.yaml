# ============================================================
# SCIAD — Frontend (Angular servido por nginx)
# 2 réplicas, config de nginx desde ConfigMap, sistema de archivos
# de solo lectura con directorios temporales en memoria (igual que tmpfs).
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: jsalazart3
  labels:
    app.kubernetes.io/name: sciad-frontend
    app.kubernetes.io/part-of: sciad
spec:
  selector:
    app.kubernetes.io/name: sciad-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: jsalazart3
  labels:
    app.kubernetes.io/name: sciad-frontend
    app.kubernetes.io/part-of: sciad
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sciad-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sciad-frontend
        app.kubernetes.io/part-of: sciad
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sciad-frontend
      containers:
        - name: nginx
          image: ghcr.io/josesalazart3/sciad-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: 32Mi
              cpu: 20m
            limits:
              memory: 128Mi
              cpu: 100m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          configMap:
            name: sciad-nginx
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: jsalazart3
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sciad-frontend
