# ============================================================
# SCIAD — Base de datos PostgreSQL 16
# StatefulSet con disco persistente. Solo accesible dentro del cluster
# (Service sin IP externa) y, con la NetworkPolicy, solo desde el backend.
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: jsalazart3
  labels:
    app.kubernetes.io/name: sciad-db
    app.kubernetes.io/part-of: sciad
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: sciad-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: jsalazart3
  labels:
    app.kubernetes.io/name: sciad-db
    app.kubernetes.io/part-of: sciad
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sciad-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sciad-db
        app.kubernetes.io/part-of: sciad
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["postgres", "-c", "max_connections=120"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: sciad
            - name: POSTGRES_USER
              value: sciad
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sciad-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 300m
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U sciad -d sciad"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U sciad -d sciad"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: sciad-db
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
