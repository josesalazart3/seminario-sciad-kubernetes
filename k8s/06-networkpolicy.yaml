# ============================================================
# SCIAD — Aislamiento de red (aplicar al final, cuando todo funcione)
#   • Todo el tráfico de entrada se niega por defecto.
#   • frontend: solo desde Traefik (namespace kube-system).
#   • backend: solo desde el frontend.
#   • db: solo desde el backend.
# Si algo deja de responder: kubectl delete -f 06-networkpolicy.yaml
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: jsalazart3
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-desde-traefik
  namespace: jsalazart3
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sciad-frontend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-desde-frontend
  namespace: jsalazart3
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sciad-backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sciad-frontend
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-desde-backend
  namespace: jsalazart3
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sciad-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sciad-backend
      ports:
        - port: 5432
